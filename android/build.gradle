// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    def rootPath = rootProject.projectDir.toPath().toAbsolutePath().normalize()
    def subPath = project.projectDir.toPath().toAbsolutePath().normalize()
    if (!subPath.startsWith(rootPath)) {
        project.layout.buildDirectory.set(file("${rootProject.projectDir}/build/subprojects/${project.name}"))
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
